version: '3.8'

services:
  ada-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ada-companion
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - NODE_ENV=development
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - DATA_DIR=/app/data
    volumes:
      - ada-data:/app/data
    restart: unless-stopped

volumes:
  ada-data:
    driver: local
