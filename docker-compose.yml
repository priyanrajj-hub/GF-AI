version: '3.8'

services:
  postgres:
    image: postgres:16-alpine@sha256:4d4c5d2c695bc3d84fae2bf4b3a4a9eb482eb4e5e4de88c4d293d3b74dfb249a
    container_name: gf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment}
      POSTGRES_DB: ${POSTGRES_DB:-gf_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gf_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gf-network

  redis:
    image: redis:7-alpine@sha256:6e75b9f7d45e07a3c3c137452d19efcb8a101b0b4e287b46ff0b6b2803b07044
    container_name: gf-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gf-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: gf-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-gf_ai}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - REFRESH_SECRET=${REFRESH_SECRET:?REFRESH_SECRET must be set}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:80,http://localhost:3000}
    volumes:
      - apidata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - gf-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: gf-worker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-gf_ai}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    volumes:
      - apidata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - gf-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: gf-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - gf-network

volumes:
  pgdata:
  redisdata:
  apidata:

networks:
  gf-network:
    driver: bridge
