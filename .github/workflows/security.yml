name: Security & Compliance Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly security sweep at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  security-audit:
    name: Comprehensive Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Full History Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run PII Scanner
        run: npm run scan:pii

      - name: Run Secret Entropy Scanner
        run: npm run scan:secrets

      - name: Production Dependency Vulnerability Check
        run: npm audit --omit=dev --audit-level=high

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run Offensive Attack & Exploitation Regression Suite
        run: npx tsx scripts/security/attack_suite.mjs

      - name: Run Security, SSRF & Financial Math Verification
        run: npx tsx scripts/test_security_and_financials.mjs
