version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gf-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gf-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: gf-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gf-network

  loki:
    image: grafana/loki:3.0.0
    container_name: gf-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infra/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - gf-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: gf-promtail
    restart: unless-stopped
    volumes:
      - ./infra/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - gf-network

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  gf-network:
    external: true
    name: gf-network
