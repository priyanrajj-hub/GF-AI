apiVersion: v1
kind: Service
metadata:
  name: {{ include "gf-ai.fullname" . }}-api
  labels:
    {{- include "gf-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 3001
      protocol: TCP
  selector:
    {{- include "gf-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
