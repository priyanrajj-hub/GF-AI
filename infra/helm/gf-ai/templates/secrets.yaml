apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gf-ai.fullname" . }}-secrets
  labels:
    {{- include "gf-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "" | quote }}
  REFRESH_SECRET: {{ .Values.secrets.refreshSecret | default "" | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "" | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | default "" | quote }}
  ELEVENLABS_API_KEY: {{ .Values.secrets.elevenlabsApiKey | default "" | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | default "" | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | default "" | quote }}
  HUGGINGFACE_API_KEY: {{ .Values.secrets.huggingfaceApiKey | default "" | quote }}
