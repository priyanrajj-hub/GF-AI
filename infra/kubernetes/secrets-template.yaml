apiVersion: v1
kind: Secret
metadata:
  name: gf-ai-secrets
  namespace: gf-ai
  labels:
    app.kubernetes.io/name: gf-ai
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Sensitive production environment variables
  # Replace placeholders with KMS, HashiCorp Vault, or External Secrets Operator
  JWT_SECRET: "REPLACE_WITH_BASE64_OR_VAULT_GENERATED_JWT_SECRET_32_BYTES"
  REFRESH_SECRET: "REPLACE_WITH_BASE64_OR_VAULT_GENERATED_REFRESH_SECRET_32_BYTES"
  DATABASE_URL: "postgresql://user:password@pg-primary.gf-ai.svc.cluster.local:5432/gf_ai?sslmode=require"
  GEMINI_API_KEY: "REPLACE_WITH_GEMINI_API_KEY"
  ELEVENLABS_API_KEY: "REPLACE_WITH_ELEVENLABS_API_KEY"
  GROQ_API_KEY: "REPLACE_WITH_GROQ_API_KEY"
  OPENROUTER_API_KEY: "REPLACE_WITH_OPENROUTER_API_KEY"
  HUGGINGFACE_API_KEY: "REPLACE_WITH_HUGGINGFACE_API_KEY"
