apiVersion: v1
kind: ConfigMap
metadata:
  name: gf-ai-config
  namespace: gf-ai
  labels:
    app.kubernetes.io/name: gf-ai
    app.kubernetes.io/component: configuration
data:
  NODE_ENV: "production"
  PORT: "3001"
  CORS_ORIGIN: "https://gf-ai.example.com,https://gf-ai-ochre.vercel.app"
  DATABASE_ENGINE: "postgres"
  REDIS_URL: "redis://gf-redis-master.gf-ai.svc.cluster.local:6379"
  GEMINI_MODEL: "gemini-2.0-flash"
  ELEVENLABS_VOICE_ID: "pFZP5JQG7iQjIQuC4Bku"
  ENABLE_TEST_AUTH: "false"
