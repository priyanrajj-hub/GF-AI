apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gf-api-hpa
  namespace: gf-ai
  labels:
    app.kubernetes.io/name: gf-ai
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gf-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
